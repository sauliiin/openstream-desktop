name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact-glob: release/*.AppImage
          - os: windows-latest
            script: dist:win
            artifact-glob: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: omnistream-desktop-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
